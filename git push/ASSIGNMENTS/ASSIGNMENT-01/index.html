<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Quiz | Student Details</title>
    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #172033;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
        }

        .quiz-card {
            width: min(100%, 460px);
            padding: 40px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(30, 64, 175, 0.14);
        }

        .badge {
            display: inline-block;
            margin-bottom: 12px;
            padding: 6px 12px;
            color: #4338ca;
            background: #eef2ff;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 { margin: 0 0 8px; font-size: 2rem; }
        .intro { margin: 0 0 28px; color: #64748b; }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; font-weight: 600; }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            color: inherit;
            font: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            color: #ffffff;
            background: #4f46e5;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover { background: #4338ca; transform: translateY(-1px); }
    </style>
</head>
<body>
    <main class="quiz-card">
        <span class="badge">Welcome</span>
        <h1>HTML Quiz</h1>
        <p class="intro">Enter your details to begin the quiz.</p>

        <form action="question.html">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input id="name" type="text" name="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="class">Class</label>
                <input id="class" type="text" name="class" placeholder="Enter your class" required>
            </div>
            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input id="roll" type="text" name="roll" placeholder="Enter your roll number" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" name="email" placeholder="you@example.com" required>
            </div>
            <button type="submit">Start Quiz&nbsp; →</button>
        </form>
    </main>
</body>
</html>
